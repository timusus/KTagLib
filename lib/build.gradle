import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar
import java.util.Base64

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.vanniktech.maven.publish'
}

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    namespace = "com.simplecityapps.ktaglib"

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// TagLib's own sample corpus (taglib/tests/data) is packaged as extra androidTest assets under
// taglib-data/, so the instrumented tests can run every file through KTagLib without copying the
// corpus into this repo.
abstract class CopyTagLibTestData extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void copy() {
        fileSystemOperations.sync {
            from(sourceDir)
            into(outputDir.dir('taglib-data'))
        }
    }
}

def copyTagLibTestData = tasks.register('copyTagLibTestData', CopyTagLibTestData) {
    sourceDir.set(rootProject.layout.projectDirectory.dir('taglib/tests/data'))
    outputDir.set(layout.buildDirectory.dir('generated/taglibTestData'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.androidTest?.sources?.assets?.addGeneratedSourceDirectory(copyTagLibTestData, { it.outputDir })
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// The in-memory signing key is stored base64-encoded to avoid multiline gradle.properties issues.
def signingKeyRaw = System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKey') ?: project.findProperty('signingInMemoryKey')

def decodeSigningKey(String raw) {
    if (raw.startsWith('-----BEGIN PGP')) return raw
    try {
        def decoded = new String(Base64.decoder.decode(raw))
        return decoded.startsWith('-----BEGIN PGP') ? decoded : null
    } catch (Exception ignored) {
        return null
    }
}

def signingKey = signingKeyRaw != null ? decodeSigningKey(signingKeyRaw) : null

mavenPublishing {
    coordinates('com.simplecityapps', 'ktaglib', '2.0.0')

    configure(new AndroidSingleVariantLibrary(
            new JavadocJar.Empty(),
            new SourcesJar.Sources(),
            'release'
    ))

    publishToMavenCentral()

    pom {
        name = 'KTagLib'
        description = 'Kotlin bindings for TagLib, for reading and writing audio metadata on Android'
        url = 'https://github.com/timusus/ktaglib'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'timusus'
                name = 'Tim Malseed'
                email = 't.malseed@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/timusus/ktaglib'
            connection = 'scm:git:git://github.com/timusus/ktaglib.git'
            developerConnection = 'scm:git:ssh://git@github.com/timusus/ktaglib.git'
        }
    }
}

// gradleProperty(...) reads gradle.properties verbatim, so the base64-encoded key above
// can't be handed to signAllPublications() directly; configure the signing plugin manually
// with the decoded value instead.
if (signingKey != null) {
    apply plugin: 'signing'

    signing {
        useInMemoryPgpKeys(
                project.findProperty('signingInMemoryKeyId') as String,
                signingKey,
                project.findProperty('signingInMemoryKeyPassword') as String
        )
    }

    publishing.publications.all { publication ->
        signing.sign(publication)
    }
}
