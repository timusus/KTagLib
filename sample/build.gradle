plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    // glide 5.0.9 requires compileSdk 37 (AAR metadata); AGP 8.13 is only tested up to 36.1, so
    // gradle.properties sets android.suppressUnsupportedCompileSdk=37.0
    compileSdk 37

    namespace = "com.simplecityapps.ktaglib.sample"

    defaultConfig {
        applicationId "com.simplecityapps.ktaglib.sample"
        // material 1.14 requires minSdk 23; the library itself stays on 21
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {

    implementation project(':lib')

    // androidx.core 1.19 requires AGP 9.1+; stay on 1.18 while AGP is pinned to 8.x (#15)
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    kapt 'com.github.bumptech.glide:compiler:5.0.9'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}